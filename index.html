<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Global  */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar Container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo */
        .nav-logo a {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        /*Navigation Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        /* Individual Link */
        .nav-links a {
            color: #cccccc;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* Hover & Active States */
        .nav-links a:hover,
        .nav-links a.active {
            color: #00adb5;
        }

        .main {
            position: relative;
            width: 100%;
            height: 95vh;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            /* Darker */
            z-index: 1;

        }

        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            width: 90%;
        }

        .main-heading {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .main-text {
            font-size: 1.2rem;
            max-width: 700px;
            margin: auto;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-logo"><a href="#">Name</a></div>

        <!-- Navigation Links -->
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="main">
        <img class="main-image"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJAfmFosj9-_NWJrf0N5AsaJlTXwZi4EhN6I6MsCG8OIIhnoItl3srUdc&s=10"
            alt="">

        <div class="overlay"></div>

        <div class="main-content">
            <h2 class="main-heading">Welcome to My Website</h2>

            <p class="main-text">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit.
            </p>
        </div>
    </div>

</body>

</html>>
